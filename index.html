<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 NFL Draft — Live Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0e1a;
    --ink-2: #12182b;
    --chrome: #e8e6df;
    --gold: #d4a24a;
    --red: #d2232a;
    --blue: #013369;
    --green: #3fb87a;
    --grid: rgba(255,255,255,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--chrome);
    font-family: 'Oswald', sans-serif;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(1,51,105,0.35), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(210,35,42,0.18), transparent 55%),
      linear-gradient(180deg, #0a0e1a 0%, #06090f 100%);
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      linear-gradient(0deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ==== HEADER ==== */
  header {
    position: relative;
    z-index: 2;
    padding: 8px 12px;
    border-bottom: 2px solid rgba(212,162,74,0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(6,9,15,0.7);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    line-height: 1;
  }

  .brand .sub {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-top: 2px;
  }

  .live-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: var(--red);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 10px;
  }

  .live-badge.offline { background: #555; }
  .live-badge.checking { background: var(--gold); color: var(--ink); }

  .live-dot {
    width: 6px; height: 6px;
    background: white; border-radius: 50%;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  /* ==== STATUS BANNER ==== */
  .status-banner {
    padding: 6px 12px;
    font-size: 10px;
    letter-spacing: 1px;
    text-align: center;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(212,162,74,0.2);
    flex-shrink: 0;
  }

  .status-banner.ok { color: var(--green); }
  .status-banner.warn { color: var(--gold); }
  .status-banner.err { color: #ff6b6b; }

  /* ==== CLOCK BAR ==== */
  .clock-bar {
    position: relative;
    z-index: 2;
    padding: 10px 12px;
    background: linear-gradient(90deg, var(--blue) 0%, #01254d 100%);
    border-bottom: 1px solid rgba(212,162,74,0.4);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }

  .clock-label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 9px;
    color: var(--gold);
    margin-bottom: 2px;
  }

  .clock-team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    line-height: 1.05;
  }

  .clock-team-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clock-center { text-align: center; }

  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212,162,74,0.5);
    line-height: 1;
  }

  .clock-pick {
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 3px;
    opacity: 0.8;
  }

  .controls { text-align: right; display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }

  .btn {
    padding: 5px 8px;
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { background: var(--gold); color: var(--ink); }

  .btn.primary {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  .btn.primary:hover { background: white; color: var(--red); }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ==== MAIN ==== */
  main {
    position: relative;
    z-index: 2;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 8px 12px 12px;
    gap: 8px;
  }

  .panel {
    background: rgba(18,24,43,0.7);
    border: 1px solid rgba(212,162,74,0.2);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;
  }

  .panel-header {
    padding: 6px 10px;
    border-bottom: 1px solid rgba(212,162,74,0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--gold);
  }

  .panel-header .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.5);
  }

  .draft-list {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
    transition: scrollbar-color 0.2s;
  }

  .draft-list:hover {
    scrollbar-color: rgba(212,162,74,0.3) transparent;
  }

  .draft-list::-webkit-scrollbar { width: 6px; }
  .draft-list::-webkit-scrollbar-track { background: transparent; }
  .draft-list::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; transition: background 0.2s; }
  .draft-list:hover::-webkit-scrollbar-thumb { background: rgba(212,162,74,0.3); }

  /* Horizontal strip for recent picks */
  .recent-strip {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
    transition: scrollbar-color 0.2s;
  }

  .recent-strip:hover {
    scrollbar-color: rgba(212,162,74,0.3) transparent;
  }

  .recent-strip::-webkit-scrollbar { height: 6px; }
  .recent-strip::-webkit-scrollbar-track { background: transparent; }
  .recent-strip::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; transition: background 0.2s; }
  .recent-strip:hover::-webkit-scrollbar-thumb { background: rgba(212,162,74,0.3); }

  .recent-card {
    flex: 0 0 200px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(212,162,74,0.15);
    border-radius: 3px;
    padding: 8px 10px;
    position: relative;
  }

  .recent-card .team-logo {
    width: 32px !important;
    height: 32px !important;
    object-fit: contain;
    display: block;
    margin-bottom: 6px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .recent-card.new {
    animation: pickReveal 0.8s ease-out;
  }

  .recent-card .num {
    position: absolute;
    top: 4px;
    right: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--gold);
    line-height: 1;
    opacity: 0.7;
  }

  .recent-card .team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.8px;
    line-height: 1.1;
    margin-bottom: 4px;
    padding-right: 22px;
  }

  .recent-card .player {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.95);
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .recent-card .meta {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.3px;
    font-weight: 600;
  }

  .recent-card .trade {
    font-size: 8px;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }

  .section-divider {
    padding: 5px 10px;
    background: rgba(0,0,0,0.55);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold);
    border-top: 1px solid rgba(212,162,74,0.15);
    border-bottom: 1px solid rgba(212,162,74,0.15);
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    align-items: center;
  }

  .row.pick.new {
    animation: pickReveal 0.8s ease-out;
  }

  @keyframes pickReveal {
    0% { background: rgba(212,162,74,0.4); transform: translateX(-10px); opacity: 0; }
    100% { background: transparent; transform: translateX(0); opacity: 1; }
  }

  .row.on-clock {
    background: rgba(210,35,42,0.12);
    border-left: 3px solid var(--red);
  }

  .row .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--gold);
    line-height: 1;
    text-align: center;
  }

  .row.upcoming .num { color: rgba(212,162,74,0.6); }

  .row .team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 1.1;
    margin-bottom: 2px;
  }

  .row .player {
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
  }

  .row .meta {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .row .trade {
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
  }

  .pick-pos {
    display: inline-block;
    padding: 2px 5px;
    background: var(--blue);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: 10px;
    border-radius: 2px;
  }

  .on-clock-tag {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: 9px;
    color: var(--red);
    background: rgba(210,35,42,0.2);
    padding: 2px 5px;
    border: 1px solid var(--red);
  }

  .empty-state {
    padding: 20px;
    text-align: center;
    opacity: 0.5;
    font-size: 11px;
  }

  /* ==== DEBUG PANEL ==== */
  .debug-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 200;
    background: rgba(6,9,15,0.98);
    border: 1px solid var(--gold);
    border-radius: 4px;
    display: none;
    flex-direction: column;
    padding: 12px;
  }

  .debug-panel.show { display: flex; }

  .debug-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(212,162,74,0.3);
    margin-bottom: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--gold);
  }

  #debug-content {
    flex: 1;
    overflow: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--chrome);
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ==== TEAM LOGOS ==== */
  .team-logo {
    display: inline-block;
    vertical-align: middle;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  /* Header NFL shield — replaces the old CSS hex shield */
  .nfl-shield-img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  /* Logo on the clock bar (big) */
  .clock-logo {
    width: 34px;
    height: 34px;
    margin-right: 8px;
  }

  .clock-team-row {
    display: flex;
    align-items: center;
  }

  /* Logo in recent-picks horizontal cards */
  .recent-card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    padding-right: 22px;
  }

  .recent-card-head .team-logo {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .recent-card-head .team {
    margin-bottom: 0;
    padding-right: 0;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Logo in on-clock and upcoming rows */
  .row .team-logo {
    width: 28px;
    height: 28px;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .on-clock-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .on-clock-row > div {
    min-width: 0;
    flex: 1;
  }

  .row-team-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }

  .row-team-line .team {
    margin-bottom: 0;
  }

  /* Logo in announcement toast */
  .announcement-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .announcement-head .team-logo {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }

  /* ==== FIREWORKS / FLASH ==== */
  /* Canvas sits at z-index 1 (above the background grid at 0, below the
     UI chrome at z-index 2). This way fireworks are visible behind
     translucent panels but don't paint over readable content. */
  #fireworks {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .flash {
    position: fixed; inset: 0;
    background: var(--gold);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }

  .flash.active { animation: flashFire 0.4s ease-out; }

  @keyframes flashFire {
    0% { opacity: 0.5; }
    100% { opacity: 0; }
  }

  /* ==== ANNOUNCEMENT (bottom-right toast — never covers board) ==== */
  /* Modal backdrop — fills the screen when announcement shows */
  .announcement-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    opacity: 0;
    pointer-events: none;
    z-index: 59;
    transition: opacity 0.3s ease-out;
  }

  .announcement-backdrop.show {
    opacity: 1;
  }

  /* Center-screen interruptor modal */
  .announcement {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    z-index: 60;
    background: linear-gradient(135deg, var(--blue), #012a56);
    border: 3px solid var(--gold);
    padding: 32px 48px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 0 80px rgba(212,162,74,0.7), 0 20px 60px rgba(0,0,0,0.9);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: min(90vw, 440px);
  }

  .announcement.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .announcement .label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 5px;
    color: var(--gold);
    font-size: 13px;
    margin-bottom: 14px;
  }

  .announcement-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .announcement-head .team-logo {
    width: 52px !important;
    height: 52px !important;
    object-fit: contain;
  }

  .announcement .team-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    line-height: 1;
    text-align: left;
  }

  .announcement .select-text {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    margin: 14px 0;
  }

  .announcement .player-big {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .announcement .player-meta {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 1.5px;
  }

  /* Corner toast for trades — less intrusive than the pick-announcement modal */
  .trade-toast {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 55;
    background: linear-gradient(135deg, #2a1a00, #1a0f00);
    border: 2px solid var(--gold);
    padding: 10px 14px;
    min-width: 200px;
    opacity: 0;
    transform: translateX(calc(100% + 20px));
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 30px rgba(212,162,74,0.5), 0 6px 20px rgba(0,0,0,0.8);
  }

  .trade-toast.show {
    opacity: 1;
    transform: translateX(0);
  }

  .trade-toast .toast-label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    color: var(--gold);
    font-size: 10px;
    margin-bottom: 3px;
  }

  .trade-toast .toast-team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .trade-toast .toast-desc {
    font-size: 10px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.5px;
  }

  /* Breaking news toast — stacks below the trade toast, wider for longer text */
  .news-toast {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 55;
    background: linear-gradient(135deg, #1a1a2a, #0a0a15);
    border: 1px solid rgba(212,162,74,0.4);
    border-left: 3px solid var(--gold);
    padding: 8px 12px;
    max-width: 340px;
    opacity: 0;
    transform: translateX(calc(-100% - 20px));
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  .news-toast.show {
    opacity: 1;
    transform: translateX(0);
  }

  .news-toast .toast-label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    color: var(--gold);
    font-size: 9px;
    margin-bottom: 3px;
  }

  .news-toast .toast-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.9);
    line-height: 1.35;
  }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>
<div class="flash" id="flash"></div>
<div class="announcement-backdrop" id="announcement-backdrop"></div>

<div class="trade-toast" id="trade-toast">
  <div id="trade-toast-body"></div>
</div>

<div class="news-toast" id="news-toast">
  <div id="news-toast-body"></div>
</div>

<div class="announcement" id="announcement">
  <div class="label">★ THE PICK IS IN ★</div>
  <div class="announcement-head">
    <img class="team-logo" id="ann-logo" src="" alt="" onerror="this.style.visibility='hidden'">
    <div class="team-big" id="ann-team"></div>
  </div>
  <div class="select-text">— SELECT —</div>
  <div class="player-big" id="ann-player"></div>
  <div class="player-meta" id="ann-meta"></div>
</div>

<header>
  <div class="brand">
    <img class="nfl-shield-img" src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png" alt="NFL" onerror="this.style.display='none'">
    <div>
      <h1>Draft Central</h1>
      <div class="sub" id="header-sub">2026 · Round 1 · Pittsburgh</div>
    </div>
  </div>
  <div class="live-badge checking" id="live-badge">
    <span class="live-dot"></span>
    <span id="live-label">CONNECTING</span>
  </div>
</header>

<div class="status-banner warn" id="status-banner">Initializing data feed…</div>

<div class="clock-bar">
  <div>
    <div class="clock-label" id="clock-label">On the Clock</div>
    <div class="clock-team-row">
      <img class="clock-logo" id="clock-logo" src="" alt="" onerror="this.style.visibility='hidden'">
      <div class="clock-team" id="on-clock-team">—</div>
    </div>
  </div>
  <div class="clock-center">
    <div class="clock-time" id="clock-time">10:00</div>
    <div class="clock-pick" id="clock-pick">Pick — of 32</div>
  </div>
  <div class="controls">

// CORS fallback strategy: ESPN's API doesn't send CORS headers for browser

const FETCH_STRATEGIES = [

// Pattern: https://a.espncdn.com/i/teamlogos/nfl/500/{abbr}.png

// ==================================================================
// AUDIO — firework sound only (no horn)
// ==================================================================
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playFireworkSound(delay = 0) {
  const ctx = getCtx();
  const now = ctx.currentTime + delay;

  // Whistle — rising sweep
  const whistle = ctx.createOscillator();
  const whistleGain = ctx.createGain();
  whistle.type = 'sine';
  whistle.frequency.setValueAtTime(400, now);
  whistle.frequency.exponentialRampToValueAtTime(1800, now + 0.45);
  whistleGain.gain.setValueAtTime(0, now);
  whistleGain.gain.linearRampToValueAtTime(0.06, now + 0.1);
  whistleGain.gain.linearRampToValueAtTime(0.03, now + 0.4);
  whistleGain.gain.linearRampToValueAtTime(0, now + 0.5);
  whistle.connect(whistleGain);
  whistleGain.connect(ctx.destination);
  whistle.start(now);
  whistle.stop(now + 0.5);

  // Boom — low thump
  const boomTime = now + 0.48;
  const boom = ctx.createOscillator();
  const boomGain = ctx.createGain();
  boom.type = 'sine';
  boom.frequency.setValueAtTime(120, boomTime);
  boom.frequency.exponentialRampToValueAtTime(40, boomTime + 0.35);
  boomGain.gain.setValueAtTime(0, boomTime);
  boomGain.gain.linearRampToValueAtTime(0.3, boomTime + 0.02);
  boomGain.gain.exponentialRampToValueAtTime(0.001, boomTime + 0.5);
  boom.connect(boomGain);
  boomGain.connect(ctx.destination);
  boom.start(boomTime);
  boom.stop(boomTime + 0.5);

  // Crackle — sparse filtered noise
  const crackleTime = boomTime + 0.05;
  const bufferSize = ctx.sampleRate * 1.2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    const t = i / bufferSize;
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 1.5) * (Math.random() > 0.85 ? 1 : 0.15);
  }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 3500;
  filter.Q.value = 0.8;
  const crackleGain = ctx.createGain();
  crackleGain.gain.setValueAtTime(0.12, crackleTime);
  crackleGain.gain.exponentialRampToValueAtTime(0.001, crackleTime + 1.1);
  src.connect(filter);
  filter.connect(crackleGain);
  crackleGain.connect(ctx.destination);
  src.start(crackleTime);
  src.stop(crackleTime + 1.1);
}

// ==================================================================
// FIREWORKS CANVAS
// ==================================================================
const canvas = document.getElementById('fireworks');
const fctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createFirework(x, y, colorHue) {
  for (let i = 0; i < 70; i++) {
    const angle = (Math.PI * 2 * i) / 70 + Math.random() * 0.3;
    const speed = 2.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.008 + Math.random() * 0.012,
      size: 2 + Math.random() * 2,
      hue: colorHue + (Math.random() * 40 - 20)
    });
  }
}

function animate() {
  // Clear canvas with full transparency (canvas sits behind UI now).
  // We use source-over with a low-alpha clear-to-transparent trick by
  // just clearing the whole canvas each frame — no dark fade needed
  // since the body background already provides the dark atmosphere.
  fctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08; p.vx *= 0.99; p.vy *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) return false;
    fctx.globalAlpha = p.life;
    fctx.fillStyle = `hsl(${p.hue}, 100%, ${50 + p.life * 30}%)`;
    fctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
    fctx.shadowBlur = 12;
    fctx.beginPath();
    fctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    fctx.fill();
    return true;
  });
  fctx.shadowBlur = 0;
  fctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
animate();

function launchFireworksShow() {
  const palettes = [45, 0, 220, 45, 0]; // gold, red, blue
  let i = 0;
  const burst = () => {
    const x = canvas.width * (0.15 + Math.random() * 0.7);
    const y = canvas.height * (0.15 + Math.random() * 0.4);
    createFirework(x, y, palettes[i % palettes.length]);
    playFireworkSound();
    i++;
    if (i < 4) setTimeout(burst, 400 + Math.random() * 300);
  };
  burst();
}

// ==================================================================

function fmtTime(s) {
  if (s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function currentOnClockIndex() {
  // The pick that is currently on the clock: first un-announced pick.
  return draftState.findIndex(p => !p.announced);
}

function renderClock() {
  $clockLabel.textContent = clockSyncedToFeed ? 'On the Clock · SYNCED' : 'On the Clock';
  const idx = currentOnClockIndex();
  if (idx === -1) {
    $onClockTeam.textContent = 'DRAFT COMPLETE';
    $clockTime.textContent = '00:00';
    $clockPick.textContent = 'All 32 picks in';
    $clockLogo.style.visibility = 'hidden';
    return;
  }
  const next = draftState[idx];
  const elapsed = Math.floor((Date.now() - pickTimerStart) / 1000);
  const remaining = PICK_CLOCK_SECONDS - elapsed;
  $onClockTeam.textContent = next.team;
  const logoUrl = teamLogoUrl(next.team);
  if (logoUrl) {
    $clockLogo.src = logoUrl;
    $clockLogo.style.visibility = 'visible';
  } else {
    $clockLogo.style.visibility = 'hidden';
  }
  $clockTime.textContent = fmtTime(remaining);
  $clockPick.textContent = `Pick ${next.pick} of 32${next.originalTeam ? ' · via ' + next.originalTeam : ''}`;
  $clockTime.style.color = remaining <= 60 ? 'var(--red)' : 'var(--gold)';
}

function tradeLine(p) {

}

// Helper: render a <div class="trade"> only if there is trade info on the pick.

function setFeedStatus(status, message) {

// ==================================================================
// ANNOUNCE PICK (fireworks + sound + card)
// ==================================================================
// ==================================================================
// EVENT QUEUE
// ==================================================================
// ESPN's API is poll-based, not push-based, but a single poll can surface
// multiple meaningful state changes at once (e.g. a pick dropped AND a
// team traded up in the same 20-second window). Rather than collapse them
// into one update, we diff the fresh state against our local state, emit
// discrete events, and drain them through a queue so each celebration
// gets its moment instead of stepping on the previous one.
//
// Event types:
//   - pick_made:            a pick newly confirmed (SELECTION_MADE) — fireworks + modal
//   - trade_detected:       a pick's team or tradeNote changed — brief toast
//   - status_changed:       pick status moved (PENDING → ON_THE_CLOCK, etc.)
//   - player_updated:       player/pos/school corrected on an announced pick (silent)
//
// Only user-facing events (pick_made, trade_detected) use the queue.
// Silent updates apply immediately during reconciliation.

const eventQueue = [];
let eventQueueDraining = false;

function enqueueEvent(event) {
  eventQueue.push(event);
  if (!eventQueueDraining) drainEventQueue();
}

async function drainEventQueue() {
  eventQueueDraining = true;
  while (eventQueue.length > 0) {
    const event = eventQueue.shift();
    try {
      await handleEvent(event);
    } catch (err) {
      console.error('Event handler error:', err, event);
    }
  }
  eventQueueDraining = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function handleEvent(event) {
  switch (event.type) {
    case 'pick_made':
      announcePick(event.pick);
      // Hold the next event until the modal/fireworks finish (3.5s show + 0.3s gap).
      await sleep(3800);
      break;
    case 'trade_detected':
      showTradeToast(event.pick, event.tradeDescription);
      await sleep(1500); // shorter — trade toast is a subtler interruption
      break;
    case 'news_posted':
      showNewsToast(event.news);
      await sleep(1200);
      break;
    default:
      // No celebration; return immediately so subsequent queued events proceed.
      break;
  }
}

// Small corner toast for breaking news items (Schefter scoops, etc.)
function showNewsToast(news) {
  const toast = document.getElementById('news-toast');
  const body = document.getElementById('news-toast-body');
  body.innerHTML = `
    <div class="toast-label">📰 ${news.byline.toUpperCase()}</div>
    <div class="toast-desc">${news.headline}</div>
  `;
  toast.classList.add('show');
  // Auto-dismiss after 6s (enough to read a Schefter scoop)
  clearTimeout(window.__newsToastTimer);
  window.__newsToastTimer = setTimeout(() => toast.classList.remove('show'), 6000);
}

// Small corner toast for trades — distinct from the big pick-announcement modal.
function showTradeToast(pick, description) {
  const toast = document.getElementById('trade-toast');
  const toastBody = document.getElementById('trade-toast-body');
  toastBody.innerHTML = `
    <div class="toast-label">⇄ TRADE</div>
    <div class="toast-team">${pick.team}</div>
    <div class="toast-desc">${description}</div>
  `;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ==================================================================
function announcePick(pick) {
  const logoUrl = teamLogoUrl(pick.team);
  if (logoUrl) {
    $annLogo.src = logoUrl;
    $annLogo.style.visibility = 'visible';
  } else {
    $annLogo.style.visibility = 'hidden';
  }
  $annTeam.textContent = pick.team;
  $annPlayer.textContent = pick.player || '(pick announced)';
  $annMeta.textContent = [pick.pos, pick.school].filter(Boolean).join(' · ') +
    (pick.originalTeam ? ' · via ' + pick.originalTeam : '');
  $announcementBackdrop.classList.add('show');
  $announcement.classList.add('show');

  $flash.classList.remove('active');
  void $flash.offsetWidth;
  $flash.classList.add('active');

  launchFireworksShow();

  setTimeout(() => {
    $announcement.classList.remove('show');
    $announcementBackdrop.classList.remove('show');
  }, 3500);
}

// ==================================================================
// ESPN API FETCH
// ==================================================================
// Handle a few possible shapes ESPN has returned over the years for
// the /draft endpoint. We look for:
//   - rounds[].picks[] (most common site.web.api shape)
//   - picks[] directly
//   - items[] (core API shape)
// For each pick, we pull:
//   - overall/pick number
//   - team (displayName, abbreviation, or nested team.displayName)
//   - athlete (displayName, firstName+lastName)
//   - position (abbreviation)
//   - college/school
// ==================================================================
// ESPN position and team data are available in the draft response itself
// under json.positions[] and json.teams[]. We populate these lookup maps
// dynamically on every fetch so the data is always current and complete.
// Static fallbacks are provided only for cases where the runtime data
// hasn't loaded yet (pre-first-fetch).
const POSITION_ID_MAP = {
  '1':   'WR',
  '8':   'QB',
  '9':   'RB',
  '46':  'OT',
  '264': 'EDGE'
};

const TEAM_ID_MAP = {
  // Fallback only — overridden at runtime from json.teams[]
};

// Optional: once we load ESPN's team list, we also cache their exact logo
// URLs. Keyed by team display name, used by teamLogoUrl() as a higher-
// fidelity source than our guessed abbreviation-based URLs.
const TEAM_LOGO_URL_MAP = {};

function resolvePosition(positionObj) {
  if (!positionObj) return null;
  return positionObj.abbreviation
    || positionObj.abbrev
    || positionObj.shortName
    || positionObj.name
    || POSITION_ID_MAP[positionObj.id]
    || (positionObj.id ? `POS-${positionObj.id}` : null);
}

// Called before picks are extracted. ESPN's draft response includes
// json.positions[] and json.teams[] — the full, authoritative lookup
// tables for position IDs and team IDs. By merging these into our maps
// at runtime, we never need to guess or maintain a hardcoded list that
// could fall out of sync.
function hydrateReferenceMaps(json) {
  if (Array.isArray(json?.positions)) {
    json.positions.forEach(pos => {
      if (pos.id && pos.abbreviation) {
        POSITION_ID_MAP[String(pos.id)] = pos.abbreviation;
      }
    });
  }
  if (Array.isArray(json?.teams)) {
    json.teams.forEach(team => {
      if (team.id && team.displayName) {
        TEAM_ID_MAP[String(team.id)] = team.displayName;
      }
      // Cache ESPN's canonical logo URL keyed by display name
      if (team.displayName && team.logo) {
        TEAM_LOGO_URL_MAP[team.displayName] = team.logo;
      }
    });
  }
}

function extractPicks(json) {
  let rawPicks = [];
  if (json && Array.isArray(json.rounds)) {
    json.rounds.forEach(r => {
      const roundNum = r.number || r.round || r.id || null;
      if (Array.isArray(r.picks)) {
        // Attach round number to each pick so we can track it.
        r.picks.forEach(p => rawPicks.push({ ...p, _round: roundNum }));
      }
    });
  }
  if (rawPicks.length === 0 && Array.isArray(json.picks)) rawPicks = json.picks;
  if (rawPicks.length === 0 && Array.isArray(json.items)) rawPicks = json.items;

  return rawPicks.map(p => {
    const num = p.overall ?? p.pick ?? p.selection ?? (p.displayName ? parseInt(p.displayName) : null);
    const team = p.team?.displayName
      || p.team?.name
      || p.teamName
      || p.franchise?.displayName
      || (p.teamId ? TEAM_ID_MAP[String(p.teamId)] : null)
      || null;
    const athlete = p.athlete || p.player || p.prospect || {};
    const playerName = athlete.displayName || athlete.fullName || athlete.name
      || [athlete.firstName, athlete.lastName].filter(Boolean).join(' ')
      || null;
    // Position — ESPN often gives just { id: "46" }, so use the ID map.
    const pos = resolvePosition(athlete.position)
      || resolvePosition(p.position)
      || (typeof athlete.position === 'string' ? athlete.position : null)
      || p.pos
      || null;
    // School — for draft prospects, ESPN puts the college under athlete.team
    // (since from the prospect's perspective, their college IS their team).
    // Fall back to legacy college/school paths if the shape ever changes.
    const school =
      athlete.team?.location ||
      athlete.team?.shortDisplayName ||
      athlete.team?.displayName ||
      athlete.team?.name ||
      athlete.college?.name ||
      athlete.college?.displayName ||
      athlete.college?.shortName ||
      athlete.collegeName ||
      (typeof athlete.college === 'string' ? athlete.college : null) ||
      athlete.school?.name ||
      (typeof athlete.school === 'string' ? athlete.school : null) ||
      p.college?.name ||
      null;
    const round = p._round || p.round || p.roundNumber || null;
    // Trade info: ESPN exposes `tradeNote` directly (e.g. "From DAL"), plus
    // a `traded` boolean. When true but no note, we display a generic flag.
    const traded = p.traded === true;
    const tradeNote = p.tradeNote || (traded ? 'VIA TRADE' : null);
    // Pick status — ESPN uses an enum. Known value: SELECTION_MADE. Probable
    // others: ON_THE_CLOCK, PICK_IN, PENDING, TRADED. We surface this so the
    // UI can eventually react to the "pick is in" state (announcer walking up
    // vs. actual selection revealed). For now just stored for inspection.
    const status = p.status || null;
    const pickTimeRaw = p.pickTime || p.time || p.timestamp || p.date || p.pickMadeAt || null;
    const pickTime = pickTimeRaw ? new Date(pickTimeRaw).getTime() : null;
    return { num, team, playerName, pos, school, round, tradeNote, traded, status, pickTime, raw: p };
  }).filter(p => p.num != null);
}

// Look for a top-level clock/status field on the ESPN payload. Field names
// vary; try the common candidates. Returns { onClockSince: ms } or null.
function extractClockStatus(json) {
  const candidates = [
    json?.status,
    json?.draftStatus,
    json?.currentPick,
    json?.onTheClock,
    json?.clock
  ];
  for (const c of candidates) {
    if (!c) continue;
    const start = c.onClockSince || c.startTime || c.start || c.pickStartTime || c.clockStart;
    if (start) {
      const t = new Date(start).getTime();
      if (!isNaN(t)) return { onClockSince: t };
    }
  }
  return null;
}

// Extract ESPN's breakingNews[] — Schefter + Co. live ticker. Each entry
// has { id, descriptions.headline, dates.created, attributes.byline }.
// We return them newest-first and let the event loop filter ones we've
// already shown (by id).
function extractBreakingNews(json) {
  if (!Array.isArray(json?.breakingNews)) return [];
  return json.breakingNews.map(item => ({
    id: item.id,
    headline: item.descriptions?.headline || item.payload || '',
    byline: item.attributes?.byline?.value || item.attributes?.byline || 'ESPN',
    created: item.dates?.created ? new Date(item.dates.created).getTime() : 0
  })).filter(n => n.id && n.headline);
}

async function tryFetch(strategy) {
  const res = await fetch(strategy.url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fetchDraftData() {
  let json = null;
  let usedStrategy = null;
  let lastErr = null;

  // Try the last known good strategy first; if it fails, fall through.
  const order = [
    FETCH_STRATEGIES[workingStrategyIndex],
    ...FETCH_STRATEGIES.filter((_, i) => i !== workingStrategyIndex)
  ];

  for (const strategy of order) {
    try {
      json = await tryFetch(strategy);
      usedStrategy = strategy;
      workingStrategyIndex = FETCH_STRATEGIES.indexOf(strategy);
      break;
    } catch (err) {
      lastErr = err;
      // Continue to next strategy
    }
  }

  if (!json) {
    // All strategies failed
    if (lastSuccessfulFetch) {
      setFeedStatus('stale', `Feed lost — last sync ${new Date(lastSuccessfulFetch).toLocaleTimeString()}. Clock runs locally; SYNC to retry.`);
    } else {
      setFeedStatus('error', `All feed sources blocked. Clock runs locally. Try SYNC or a different browser. (${lastErr?.message || 'unknown'})`);
    }
    return;
  }

  // Successfully got JSON — extract picks and update state
  window.__lastEspnJson = json;  // exposed for the DEBUG button to inspect
  hydrateReferenceMaps(json);    // populate position/team maps from authoritative source
  const extracted = extractPicks(json);
  const clockStatus = extractClockStatus(json);
  const breakingNews = extractBreakingNews(json);

  // ============ DIFF + EVENT EMISSION ============
  // For each pick ESPN returned, compare against our local slot and emit
  // events for anything meaningful that changed. Then apply the updates.
  //
  // Suppression rules:
  //   - First fetch after page load: suppress pick_made and trade_detected
  //     events, so reloading the page mid-draft doesn't replay every pick.
  //   - Subsequent fetches: events fire normally.
  const isFirstFetch = !lastSuccessfulFetch;
  const newEvents = [];

  extracted.forEach(ep => {
    const slot = draftState.find(s => s.pick === ep.num);
    if (!slot) return;

    // Stash raw for debug inspection.
    if (ep.raw) slot.rawEspn = ep.raw;

    // --- EVENT: pick_made ---
    // A pick transitions from unannounced to announced. ESPN's SELECTION_MADE
    // status is the authoritative signal; a player name with no conflicting
    // status is accepted as a secondary signal.
    const isConfirmed = ep.status === 'SELECTION_MADE' || (ep.playerName && !ep.status);
    if (ep.playerName && !slot.announced && isConfirmed) {
      slot.player = ep.playerName;
      slot.pos = ep.pos || slot.pos;
      slot.school = ep.school || slot.school;
      slot.pickTime = ep.pickTime;
      slot.announced = true;
      if (!isFirstFetch) {
        newEvents.push({ type: 'pick_made', pick: slot });
      }
    } else if (ep.playerName && slot.announced) {
      // Silent update — already-announced pick has updated data (ESPN fixed
      // a typo, or provided info we didn't have before). Just apply it.
      const changed = slot.player !== ep.playerName || slot.pos !== ep.pos || slot.school !== ep.school;
      slot.player = ep.playerName;
      if (ep.pos) slot.pos = ep.pos;
      if (ep.school) slot.school = ep.school;
      if (ep.pickTime) slot.pickTime = ep.pickTime;
      // Not queued — player_updated is silent, UI re-renders naturally.
    }

    // --- EVENT: trade_detected ---
    // Either the team changed from what we had, or tradeNote appeared for
    // the first time. We emit a single event per new trade, not per re-render.
    const prevTeam = slot.team;
    const prevTradeNote = slot.tradeNote;
    let tradeChangeDescription = null;

    if (ep.team && ep.team !== prevTeam) {
      // Team changed mid-draft — this is an active trade-up/trade-down.
      if (!slot.originalTeam) slot.originalTeam = prevTeam;
      slot.team = ep.team;
      tradeChangeDescription = `Acquired pick from ${prevTeam}`;
    }
    if (ep.tradeNote && ep.tradeNote !== prevTradeNote) {
      // ESPN surfaced new trade metadata on this pick.
      slot.tradeNote = ep.tradeNote;
      tradeChangeDescription = tradeChangeDescription || ep.tradeNote;
    }
    if (tradeChangeDescription && !isFirstFetch) {
      newEvents.push({
        type: 'trade_detected',
        pick: slot,
        tradeDescription: tradeChangeDescription
      });
    }

    // Apply non-celebratory updates directly (no event needed).
    if (ep.round) slot.round = ep.round;
    if (ep.status) slot.status = ep.status;
  });

  // --- EVENT: news_posted ---
  // Each breaking-news item shows once as a ticker event. On first fetch,
  // mark everything as already seen (suppresses replay on page reload).
  breakingNews.forEach(news => {
    if (!seenNewsIds.has(news.id)) {
      seenNewsIds.add(news.id);
      if (!isFirstFetch) {
        newEvents.push({ type: 'news_posted', news });
      }
    }
  });

  // Enqueue events in pick order so they play naturally (earlier picks first,
  // earlier events first). Trades that fire alongside a pick on the same team
  // are attached to that pick: the pick celebration shows first, then trade toast.
  // News events don't belong to a pick — they sort by their creation timestamp.
  newEvents.sort((a, b) => {
    // News ordered by created time; anchor at 0 so picks still group naturally
    const aPick = a.pick?.pick || 0;
    const bPick = b.pick?.pick || 0;
    if (aPick !== bPick) return aPick - bPick;
    const order = { pick_made: 0, trade_detected: 1, news_posted: 2 };
    return (order[a.type] || 99) - (order[b.type] || 99);
  });
  newEvents.forEach(e => enqueueEvent(e));

  // Track lastAnnouncedPick for render-layer animation control (separate
  // from the event queue — this is just "what's the newest pick on the board").
  const maxAnnounced = Math.max(...draftState.filter(p => p.announced).map(p => p.pick), 0);
  if (maxAnnounced > lastAnnouncedPick) {
    lastAnnouncedPick = maxAnnounced;
  }
  // ============ END DIFF + EVENT EMISSION ============

  // Determine current round: the round of the on-the-clock pick, or the
  // highest round seen in announced picks if the draft is over.
  const onClockPick = draftState.find(p => !p.announced);
  if (onClockPick?.round) {
    currentRound = onClockPick.round;
  } else {
    const maxRound = Math.max(...draftState.filter(p => p.round).map(p => p.round), 1);
    currentRound = maxRound;
  }
  updateRoundDisplay();

  // ============ CLOCK SYNC ============
  // Priority order for determining when the current pick went on the clock:
  //   1. Top-level clock field from ESPN (most accurate if present)
  //   2. Timestamp of the previous pick (when it was announced = when the
  //      next team went on the clock)
  //   3. Time of this fetch (fallback, already set as default)
  if (clockStatus?.onClockSince) {
    pickTimerStart = clockStatus.onClockSince;
    clockSyncedToFeed = true;
  } else {
    // Find the most recent announced pick with a timestamp; the next pick
    // went on the clock at that moment.
    const lastAnnouncedWithTime = draftState
      .filter(p => p.announced && p.pickTime)
      .sort((a, b) => b.pick - a.pick)[0];
    if (lastAnnouncedWithTime && maxAnnounced > 0) {
      pickTimerStart = lastAnnouncedWithTime.pickTime;
      clockSyncedToFeed = true;
    }
    // If no timestamps exist yet (pre-draft or very early), leave
    // pickTimerStart at whatever it was (initialized to page load time).
  }
  // =====================================

  lastSuccessfulFetch = Date.now();
  const announcedCount = draftState.filter(p => p.announced).length;
  const via = usedStrategy.name === 'direct' ? 'ESPN direct' : `via ${usedStrategy.name} proxy`;
  setFeedStatus('live',
    `Live feed (${via}) · ${announcedCount} picks in · synced ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`);

  renderList();
  renderClock();
}

// ==================================================================
// MAIN LOOP
// ==================================================================
function tick() {
  renderClock();
  // If the local 10-min clock hits zero without the feed confirming the
  // pick, show the next team as "on the clock" and reset the timer. This
  // keeps the app useful even in offline mode.
  const elapsed = Math.floor((Date.now() - pickTimerStart) / 1000);
  if (elapsed >= PICK_CLOCK_SECONDS) {
    const idx = currentOnClockIndex();
    if (idx >= 0 && feedStatus !== 'live') {
      // In non-live modes, auto-advance with a placeholder announcement
      const pick = draftState[idx];
      pick.announced = true;
      pick.player = pick.player || '(awaiting ESPN confirmation)';
      announcePick(pick);
      lastAnnouncedPick = pick.pick;
      pickTimerStart = Date.now();
      renderList();
    } else {
      // Feed is live and didn't report it yet — just reset timer so we
      // don't spam the announcement. ESPN will catch up.
      pickTimerStart = Date.now();
    }
  }
}

// Clock ticks every 500ms so the seconds display is always fresh.
setInterval(tick, 500);
// Poll ESPN every POLL_INTERVAL_MS.
setInterval(fetchDraftData, POLL_INTERVAL_MS);

// ==================================================================
// CONTROLS
// ==================================================================
$btnRefresh.addEventListener('click', () => {
  getCtx().resume();
  setFeedStatus('connecting', 'Resyncing with ESPN…');
  fetchDraftData();
});

document.getElementById('btn-debug').addEventListener('click', () => {
  const panel = document.getElementById('debug-panel');
  const content = document.getElementById('debug-content');
  const latest = draftState.filter(p => p.announced && p.rawEspn).slice(-1)[0];
  // Compose a diagnostic dump:
  //   1. Summary of all picks' current statuses
  //   2. Raw ESPN data for the latest announced pick
  //   3. Top-level JSON (without rounds) to reveal trade/transaction arrays
  let out = '';

  out += `=== PICK STATUSES ===\n`;
  draftState.forEach(p => {
    const status = p.status || (p.announced ? '(announced, no status field)' : '(not announced)');
    out += `#${String(p.pick).padStart(2)} ${p.team.padEnd(24)} | ${status}\n`;
  });

  if (latest) {
    out += `\n=== LATEST PICK: ${latest.team} picked ${latest.player} ===\n`;
    out += `Parsed: pos="${latest.pos}", school="${latest.school}", status="${latest.status}"\n`;
    out += `\n--- Raw ESPN pick object ---\n`;
    out += JSON.stringify(latest.rawEspn, null, 2);
  }

  if (window.__lastEspnJson) {
    // Full top-level response minus the rounds (which are the individual picks
    // we already dumped). This reveals anything ESPN puts at the top — trade
    // announcements, status objects, overall draft state, etc.
    const topLevel = { ...window.__lastEspnJson };
    if (topLevel.rounds) topLevel.rounds = '[see individual picks above]';
    out += `\n\n=== TOP-LEVEL ESPN RESPONSE (rounds collapsed) ===\n`;
    out += JSON.stringify(topLevel, null, 2);
  }

  content.textContent = out || 'No data yet.';
  panel.classList.toggle('show');
});

document.addEventListener('click', () => { getCtx().resume(); }, { once: true });

// ==================================================================
// INIT
// ==================================================================
renderClock();
renderList();
fetchDraftData(); // kick off first fetch immediately
</script>

</body>
